<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portal Acces Whatsapp</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <div>
            <b id="brand">ProjectQ</b>
            <small>WhatsApp Management</small>
        </div>
        <div><span id="profile"></span> <button id="logout" class="secondary">Keluar</button></div>
    </header>

    <main>
        <section id="login" class="panel">
            <h1>Masuk ke dashboard</h1>
            <p>Gunakan email yang terdaftar saat pendaftaran ke admin ProjectQ.</p>
            <form id="loginForm">
                <label>Email / Username<input id="username" type="email" autocomplete="username" required placeholder="gmail anda"></label>
                <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="10" placeholder="Minimal 10 karakter"></label>
                <button id="loginButton" type="submit">Masuk</button>
                <p id="loginError" class="error" role="alert"></p>
            </form>
            <p class="muted">HANYA YANG SUDAH TERDAFTAR BISA LOGIN!.</p>
        </section>

        <section id="app" hidden>
            <nav>
                <button data-view="overview">Ringkasan</button>
                <button data-view="contacts">CRM Kontak</button>
                <button data-view="keywords">Keyword Reply</button>
                <button data-view="messages">Kirim Pesan</button>
                <button data-view="schedule">Jadwalkan</button>
                <button data-view="numbers" id="numbersNav">Phone Numbers</button>
            </nav>

            <div class="toolbar">
                <label>Nomor WhatsApp 
                    <select id="phone"></select>
                </label>
                <button id="refresh">Muat ulang</button>
            </div>

            <div id="view"></div>
        </section>
    </main>

    <script src="/assets/app.js"></script>
</body>
</html>
